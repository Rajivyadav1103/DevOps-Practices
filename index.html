<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>work flow</title>
  </head>
  <body>
    <h1>work flow</h1>
    <p>1. create a branch</p>
    <p>2. make changes and commit</p>
    <p>3. push to remote</p>
    <p>4. create a pull request</p>

    <table>
      <tr>
        <th>Branch Name</th>
        <th>Commit Message</th>
        <th>Pull Request Status</th>
      </tr>
      <tr>
        <td>feature/new-feature</td>
        <td>Add new feature to the project</td>
        <td>Open</td>
      </tr>
      <tr>
        <td>bugfix/fix-bug</td>
        <td>Fix bug in the code</td>
        <td>Closed</td>
      </tr>
    </table>
  </body>
</html>
